<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3478ff"/>
      <stop offset="1" stop-color="#1843db"/>
    </linearGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bcd9ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Globe -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#globe)" stroke-width="18"/>
  <!-- Meridians -->
  <ellipse cx="256" cy="256" rx="60" ry="140" fill="none" stroke="url(#globe)" stroke-width="14"/>
  <ellipse cx="256" cy="256" rx="120" ry="140" fill="none" stroke="url(#globe)" stroke-width="10" opacity="0.7"/>
  <!-- Equator -->
  <line x1="116" y1="256" x2="396" y2="256" stroke="url(#globe)" stroke-width="14"/>
  <!-- Speech bubbles representing language -->
  <g transform="translate(330,120)">
    <path d="M0,0 L70,0 Q84,0 84,14 L84,40 Q84,54 70,54 L40,54 L28,68 L30,54 L14,54 Q0,54 0,40 Z" fill="#ff9a1f"/>
  </g>
  <g transform="translate(98,330)">
    <path d="M0,0 L70,0 Q84,0 84,14 L84,40 Q84,54 70,54 L40,54 L28,68 L30,54 L14,54 Q0,54 0,40 Z" fill="#ffd166" opacity="0.95"/>
  </g>
</svg>
